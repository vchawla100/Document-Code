                designation: { type: string }
                gender: { type: string }
                custMobileNo: { type: string }
                empName: { type: string }
                empCode: { type: string }
                typeOfCompany: { type: string }
                industrySector: { type: string }
                industryMacro: { type: string }
                industryMicro: { type: string }
