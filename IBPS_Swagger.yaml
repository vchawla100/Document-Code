openapi: 3.0.3
info:
  title: Credit Card Digital IBPS, IBPS Underwriting, Limit increase, Customer Initiated Limit Increase Decision API
  version: 1.0.0
  description: |
    Full strict schema for Credit Card Digital IBPS, IBPS Underwriting, Limit increase, Customer Initiated Limit Increase API.
    Covers complete request and response payloads.
  x-kong-target: internal
servers:
  - url: https://apiinternal-uat.rakbanktst.ae
    description: UAT environment internal gateway
    x-kong-env: uat
x-kong-plugin-acl:
  config:
    allow:
      - cram-apis-acl-grp
paths:
  /runtime-ccdigital-0/IBPS:
    post:
      summary: Execute IBPS and IBPS UW Decision
      operationId: executeIBPSUWDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
      responses:
        "200":
          description: Successful execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "400":
          description: Invalid request


components:
  schemas:

